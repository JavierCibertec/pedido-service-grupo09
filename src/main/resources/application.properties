spring.application.name=pedido-service-grupo09

server.port=8071
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Config Server: busca pedido-service-dev.properties en GitHub
spring.cloud.config.name=pedido-service
spring.profiles.active=dev
spring.config.import=configserver:http://localhost:8888

# Actuator: POST /actuator/refresh para recargar en caliente
management.endpoints.web.exposure.include=refresh,health,info
